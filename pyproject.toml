[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-intelligence-multiagent"
version = "0.1.0"
description = "Sistema multiagente de Business Intelligence com LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-ollama",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "langsmith",
    "pydantic",
    "python-dotenv",
    "requests",
    "a2a-sdk[http-server]==1.3.0",
    "uvicorn>=0.35,<1"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]

retrieval = [
    "langchain-community==0.4.2",
    "langchain-huggingface[full]==1.2.3",
    "faiss-cpu==1.15.1",
    "sentence-transformers==5.7.0"
]

nli = [
    "transformers==5.22.2",
    "torch==2.15.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"